name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify VITE_BACKEND_URL is set
        run: |
          if [ -z "$VITE_BACKEND_URL" ]; then
            echo "VITE_BACKEND_URL is not set; failing the job"
            exit 1
          fi
        shell: bash
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RETRO_FILMS_C5171 }}
          channelId: live
          projectId: retro-films-c5171
